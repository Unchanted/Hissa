<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="insights-pipeline-title insights-pipeline-desc">
  <title id="insights-pipeline-title">Insights pipeline (anonymised)</title>
  <desc id="insights-pipeline-desc">Flowchart showing how a premade merchant analysis becomes an anonymised insights report: a spec check and a minimum-cohort check refuse at no charge, otherwise the merchant pays, the 0G TEE labels and clusters the cohort, aggregates are bounded per user and noised, and only the noised report, an Arkiv receipt without contributors, and equal earnings shares leave the system.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- ============ Arrows (drawn first, behind nodes) ============ -->
  <!-- 1 → 2 -->
  <line x1="280" y1="216" x2="336" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 2 YES → 3 -->
  <line x1="544" y1="216" x2="616" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 2 NO → 9 (up from top vertex, elbow into 9's left edge) -->
  <path d="M 440,160 V 72 Q 440,64 448,64 H 640" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 3 → 4 -->
  <line x1="904" y1="216" x2="976" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 4 NO → 9 (up from top vertex, elbow into 9's right edge) -->
  <path d="M 1080,160 V 72 Q 1080,64 1072,64 H 880" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 4 YES → 5 (straight down) -->
  <line x1="1080" y1="272" x2="1080" y2="436" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 5 → 6 (row 2 runs right to left) -->
  <line x1="960" y1="472" x2="920" y2="472" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 6 → 7 -->
  <line x1="680" y1="472" x2="640" y2="472" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 7 → 8 -->
  <line x1="400" y1="472" x2="360" y2="472" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ============ Arrow labels (masked, 6–10px off the stroke) ============ -->
  <!-- 2 YES: horizontal segment, mask bottom 208, stroke 216 -->
  <rect x="564" y="196" width="32" height="12" rx="2" fill="#f5f5f5"/>
  <text x="580" y="205" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
  <!-- 2 NO: vertical segment x=440, mask left 448 -->
  <rect x="448" y="108" width="24" height="12" rx="2" fill="#f5f5f5"/>
  <text x="460" y="117" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
  <!-- 4 NO: vertical segment x=1080, mask left 1088 -->
  <rect x="1088" y="108" width="24" height="12" rx="2" fill="#f5f5f5"/>
  <text x="1100" y="117" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
  <!-- 4 YES: vertical segment x=1080, mask left 1088 -->
  <rect x="1088" y="348" width="32" height="12" rx="2" fill="#f5f5f5"/>
  <text x="1104" y="357" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

  <!-- ============ Nodes ============ -->

  <!-- 9 · Refuse (terminal, top band) -->
  <rect x="640" y="40" width="240" height="48" rx="24" fill="#f5f5f5"/>
  <rect x="640" y="40" width="240" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="760" y="61" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Refuse — no charge</text>
  <text x="760" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no report · nothing to pay</text>

  <!-- 1 · Premade analysis → predefined spec (start) -->
  <rect x="40" y="172" width="240" height="88" rx="20" fill="#f5f5f5"/>
  <rect x="40" y="172" width="240" height="88" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="160" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Choose premade analysis</text>
  <text x="160" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">→ predefined analysis spec</text>
  <text x="160" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cohort filters · subject · metrics</text>

  <!-- 2 · Decision: spec allowed? -->
  <polygon points="440,160 544,216 440,272 336,216" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="440" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Spec allowed?</text>
  <!-- criteria sit below the free bottom vertex -->
  <text x="440" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">≤3 filters · allowed dims</text>
  <text x="440" y="306" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">not a near-duplicate</text>

  <!-- 3 · Arkiv candidates → decrypt in memory → fine filter -->
  <rect x="616" y="164" width="288" height="104" rx="6" fill="#f5f5f5"/>
  <rect x="616" y="164" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="760" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Arkiv candidates by public tags</text>
  <text x="760" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">consent_insights = true</text>
  <text x="760" y="226" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">domain · region · week</text>
  <text x="760" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">→ server decrypts on demand, in memory</text>
  <text x="760" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">→ fine cohort filter</text>

  <!-- 4 · Decision: ≥ k_min distinct users? -->
  <polygon points="1080,160 1184,216 1080,272 976,216" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="1080" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">≥ k_min users?</text>
  <text x="1080" y="230" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">distinct users, e.g. 50</text>

  <!-- 5 · x402 quote + merchant pays -->
  <rect x="960" y="436" width="240" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="960" y="436" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="1080" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">x402 quote + merchant pays</text>
  <text x="1080" y="478" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">settled on Hedera</text>
  <text x="1080" y="492" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">quoted after the cohort check</text>

  <!-- 6 · 0G TEE: label + cluster -->
  <rect x="680" y="428" width="240" height="88" rx="6" fill="#f5f5f5"/>
  <rect x="680" y="428" width="240" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="800" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">0G TEE: label + cluster</text>
  <text x="800" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">label each record for this question</text>
  <text x="800" y="486" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cluster reasons into themes</text>
  <text x="800" y="500" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">themes &lt; ~20 users → "other"</text>

  <!-- 7 · Aggregate (FOCAL) -->
  <rect x="400" y="428" width="240" height="88" rx="6" fill="#f5f5f5"/>
  <rect x="400" y="428" width="240" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="520" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Aggregate</text>
  <text x="520" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one vote per user per metric</text>
  <text x="520" y="486" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">add calibrated noise</text>
  <text x="520" y="500" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">charge the privacy budget</text>

  <!-- 8 · Deliver (end) -->
  <rect x="40" y="420" width="320" height="104" rx="20" fill="#f5f5f5"/>
  <rect x="40" y="420" width="320" height="104" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="200" y="444" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Deliver</text>
  <text x="200" y="464" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0G writes report from noised tables only</text>
  <text x="200" y="478" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">→ encrypted to merchant</text>
  <text x="200" y="492" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">dm.insight_receipt on Arkiv, no contributor list</text>
  <text x="200" y="506" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">equal earnings share to each counted user</text>

  <!-- ============ Editorial callouts (italic serif, dashed leaders) ============ -->
  <text x="680" y="348" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, serif">plaintext dropped after each run — nothing stored</text>
  <path d="M 672,336 Q 664,296 700,272" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="700" cy="268" r="2" fill="#2d3142"/>

  <text x="56" y="588" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, serif">no verbatim quotes leave the system</text>
  <path d="M 276,580 Q 304,576 304,528" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="304" cy="524" r="2" fill="#2d3142"/>

  <!-- ============ Legend strip ============ -->
  <line x1="40" y1="660" x2="1240" y2="660" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

  <rect x="40" y="688" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="72" y="697" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Start / end</text>

  <rect x="220" y="688" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="252" y="697" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Step</text>

  <polygon points="400,694 412,688 424,694 412,700" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="432" y="697" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Decision</text>

  <rect x="580" y="688" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="612" y="697" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Privacy step (focal)</text>

  <line x1="760" y1="694" x2="788" y2="694" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="796" y="697" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Flow / branch</text>

  <path d="M 940,694 H 968" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="968" cy="694" r="2" fill="#2d3142"/>
  <text x="980" y="697" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Editorial aside</text>
</svg>
