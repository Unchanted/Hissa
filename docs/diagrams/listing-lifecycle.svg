<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="listing-lifecycle-title listing-lifecycle-desc">
  <title id="listing-lifecycle-title">Arkiv listing lifecycle</title>
  <desc id="listing-lifecycle-desc">State machine showing a data listing created on Arkiv as Active, patched or extended while live, then either revoked by a user request signed with its control key or expired when the consent window ends without any event, with both paths ending in Closed, where the server refuses every further release of the record.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="listing-lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="listing-lifecycle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="listing-lifecycle-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- ===== Transitions (drawn before states) ===== -->

  <!-- start → Active : createEntity -->
  <line x1="72" y1="336" x2="176" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#listing-lifecycle-arrow)"/>

  <!-- Active self-loop (top) : patchEntity -->
  <path d="M 256 280 V 240 Q 256 232 264 232 H 328 Q 336 232 336 240 V 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#listing-lifecycle-arrow)"/>

  <!-- Active self-loop (bottom) : extendEntity -->
  <path d="M 336 392 V 432 Q 336 440 328 440 H 264 Q 256 440 256 432 V 392" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#listing-lifecycle-arrow)"/>

  <!-- Active → Revoked : deleteEntity -->
  <path d="M 416 316 H 472 Q 480 316 480 308 V 200 Q 480 192 488 192 H 560" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#listing-lifecycle-arrow)"/>

  <!-- Active → Expired : consent window ends (time-based, dashed) -->
  <path d="M 416 356 H 504 Q 512 356 512 364 V 472 Q 512 480 520 480 H 560" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#listing-lifecycle-arrow)"/>

  <!-- Revoked → Shredded : wrapped key deleted -->
  <path d="M 800 192 H 1032 Q 1040 192 1040 200 V 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#listing-lifecycle-arrow)"/>

  <!-- Expired → Shredded : wrapped key deleted -->
  <path d="M 800 480 H 1032 Q 1040 480 1040 472 V 392" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#listing-lifecycle-arrow)"/>

  <!-- Shredded → end -->
  <line x1="1160" y1="336" x2="1208" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#listing-lifecycle-arrow)"/>

  <!-- ===== Transition labels (masked, 8px gap from connector) ===== -->

  <!-- createEntity -->
  <rect x="80" y="300" width="88" height="28" rx="2" fill="#f5f5f5"/>
  <text x="124" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">createEntity</text>
  <text x="124" y="324" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">platform writer</text>

  <!-- patchEntity (above top loop) -->
  <rect x="228" y="196" width="136" height="28" rx="2" fill="#f5f5f5"/>
  <text x="296" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">patchEntity</text>
  <text x="296" y="220" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">consent toggles changed</text>

  <!-- extendEntity (below bottom loop) -->
  <rect x="220" y="448" width="152" height="28" rx="2" fill="#f5f5f5"/>
  <text x="296" y="460" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">extendEntity</text>
  <text x="296" y="472" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">user renews · max ~182 days</text>

  <!-- deleteEntity (beside vertical segment x=480) -->
  <rect x="488" y="256" width="176" height="28" rx="2" fill="#f5f5f5"/>
  <text x="492" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.06em">deleteEntity</text>
  <text x="492" y="280" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.06em">signed with per-listing ctl key</text>

  <!-- consent window ends (beside vertical segment x=512) -->
  <rect x="520" y="388" width="112" height="16" rx="2" fill="#f5f5f5"/>
  <text x="524" y="400" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.06em">consent window ends</text>

  <!-- wrapped key deleted (Revoked → Shredded, above) -->
  <rect x="860" y="168" width="112" height="16" rx="2" fill="#f5f5f5"/>
  <text x="916" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">release disabled</text>

  <!-- wrapped key deleted (Expired → Shredded, below) -->
  <rect x="860" y="488" width="112" height="16" rx="2" fill="#f5f5f5"/>
  <text x="916" y="500" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">release disabled</text>

  <!-- ===== Pseudo-states ===== -->
  <circle cx="64" cy="336" r="6" fill="#2d3142"/>
  <circle cx="1216" cy="336" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
  <circle cx="1216" cy="336" r="5" fill="#2d3142"/>

  <!-- ===== States ===== -->

  <!-- Active (live) -->
  <rect x="176" y="280" width="240" height="112" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="184" y="288" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="204" y="296" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
  <text x="296" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Active</text>
  <text x="296" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">listing served</text>
  <text x="296" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">keys releasable</text>

  <!-- Revoked -->
  <rect x="560" y="136" width="240" height="112" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="568" y="144" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
  <text x="588" y="152" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
  <text x="680" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Revoked</text>
  <text x="680" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">entity deleted</text>
  <text x="680" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">delete event emitted</text>

  <!-- Expired -->
  <rect x="560" y="424" width="240" height="112" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="568" y="432" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
  <text x="588" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
  <text x="680" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Expired</text>
  <text x="680" y="500" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Arkiv stops serving</text>
  <text x="680" y="516" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">no event emitted</text>

  <!-- Shredded (focal: the real erasure) -->
  <rect x="920" y="280" width="240" height="112" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <rect x="928" y="288" width="56" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
  <text x="956" y="296" fill="#eb6c36" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">FINAL</text>
  <text x="1040" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Closed</text>
  <text x="1040" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">server refuses all releases</text>
  <text x="1040" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">no new sales or analyses</text>

  <!-- ===== Editorial callout (margin, bottom-left) ===== -->
  <text x="152" y="548" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">expiry can only be extended, never shortened</text>
  <path d="M 160 528 Q 160 416 248 416" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="256" cy="416" r="2" fill="#2d3142"/>

  <!-- ===== Legend strip ===== -->
  <line x1="40" y1="652" x2="1240" y2="652" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="684" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.18em">LEGEND</text>

  <circle cx="128" cy="680" r="6" fill="#2d3142"/>
  <text x="140" y="684" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Start</text>

  <circle cx="196" cy="680" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
  <circle cx="196" cy="680" r="5" fill="#2d3142"/>
  <text x="212" y="684" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">End</text>

  <rect x="264" y="672" width="24" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="296" y="684" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Live listing</text>

  <rect x="384" y="672" width="24" height="16" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="416" y="684" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">No longer served</text>

  <rect x="528" y="672" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="560" y="684" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Release stops</text>

  <line x1="664" y1="680" x2="696" y2="680" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#listing-lifecycle-arrow)"/>
  <text x="708" y="684" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Triggered transition</text>

  <line x1="832" y1="680" x2="864" y2="680" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#listing-lifecycle-arrow)"/>
  <text x="876" y="684" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Time-based, no event</text>
</svg>
