<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload: raw chat to encrypted listing · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Data marketplace</p>
    <h1>Upload: raw chat to encrypted listing</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="upload-sequence-title upload-sequence-desc">
      <title id="upload-sequence-title">Upload: raw chat to encrypted listing</title>
      <desc id="upload-sequence-desc">Sequence diagram of an upload: the browser parses a chat export and masks identifiers on the device, optionally sends only masked text to a 0G TEE for facet extraction (otherwise a regex fallback runs on the device), the user approves consent and expiry, the browser encrypts each listing, and the server writes the ciphertext with coarse tags to Arkiv and returns listing ids.</desc>
      <defs>
        <marker id="upload-sequence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="upload-sequence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="upload-sequence-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <!-- Background: clean paper, no dots -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- =================================================================
           LIFELINES — User 120 · Browser 320 · 0G TEE 680 · Server 920 · Arkiv 1160
           ================================================================= -->
      <line x1="120" y1="96" x2="120" y2="636" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="320" y1="96" x2="320" y2="636" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="680" y1="96" x2="680" y2="636" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="920" y1="96" x2="920" y2="636" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="1160" y1="96" x2="1160" y2="636" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- =================================================================
           OPT FRAME — spans Browser · 0G TEE only (messages 4–5)
           Frame x=264 y=252 w=444 h=116
           ================================================================= -->
      <rect x="264" y="252" width="444" height="116" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="264" y="252" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="284" y="264" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
      <text x="336" y="284" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[upload-time inference allowed]</text>
      <text x="508" y="284" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">else: regex fallback on device</text>

      <!-- =================================================================
           ACTIVATION BARS
           ================================================================= -->
      <!-- Browser holds control for the whole upload -->
      <rect x="316" y="128" width="8" height="496" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <!-- User reviews and approves -->
      <rect x="116" y="396" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <!-- 0G TEE extracts facets -->
      <rect x="676" y="312" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <!-- Server writes listings -->
      <rect x="916" y="516" width="8" height="108" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <!-- Arkiv creates entities -->
      <rect x="1156" y="548" width="8" height="44" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- =================================================================
           MESSAGES — time flows top→down. Arrows first, labels after.
           ================================================================= -->
      <!-- M1: User → Browser · drop chat export (local, muted) -->
      <line x1="120" y1="128" x2="316" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#upload-sequence-arrow)"/>
      <!-- M2: Browser self · parse, split -->
      <path d="M 324 152 L 348 152 A 8 8 0 0 1 356 160 L 356 168 A 8 8 0 0 1 348 176 L 324 176" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#upload-sequence-arrow)"/>
      <!-- M3: Browser self · mask + generalise (FOCAL, accent) -->
      <path d="M 324 200 L 348 200 A 8 8 0 0 1 356 208 L 356 224 A 8 8 0 0 1 348 232 L 324 232" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#upload-sequence-arrow-accent)"/>
      <!-- M4: Browser → 0G TEE · masked text only (network, link-blue) -->
      <line x1="324" y1="316" x2="676" y2="316" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#upload-sequence-arrow-link)"/>
      <!-- M5: 0G TEE → Browser · facet envelope (return, dashed) -->
      <line x1="676" y1="348" x2="324" y2="348" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#upload-sequence-arrow)"/>
      <!-- M6: Browser → User · review payload (local, muted) -->
      <line x1="316" y1="400" x2="124" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#upload-sequence-arrow)"/>
      <!-- M7: User → Browser · approve (local, muted) -->
      <line x1="124" y1="432" x2="316" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#upload-sequence-arrow)"/>
      <!-- M8: Browser self · per-listing keys + encrypt -->
      <path d="M 324 456 L 348 456 A 8 8 0 0 1 356 464 L 356 472 A 8 8 0 0 1 348 480 L 324 480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#upload-sequence-arrow)"/>
      <!-- M9: Browser → Server · ciphertext + public material (network, link-blue) -->
      <line x1="324" y1="520" x2="916" y2="520" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#upload-sequence-arrow-link)"/>
      <!-- M10: Server → Arkiv · executeBatch (network, link-blue) -->
      <line x1="924" y1="552" x2="1156" y2="552" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#upload-sequence-arrow-link)"/>
      <!-- M11: Arkiv → Server · entity keys, tx hash (return, dashed) -->
      <line x1="1156" y1="584" x2="924" y2="584" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#upload-sequence-arrow)"/>
      <!-- M12: Server → Browser · listing ids, explorer link (return, dashed) -->
      <line x1="916" y1="616" x2="324" y2="616" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#upload-sequence-arrow)"/>

      <!-- =================================================================
           MESSAGE LABELS — opaque paper mask, 8px gap above each stroke.
           ================================================================= -->
      <!-- M1 -->
      <rect x="172" y="108" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="220" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DROP CHAT EXPORT</text>
      <!-- M2 (right of self-loop) -->
      <rect x="364" y="156" width="184" height="12" rx="2" fill="#f5f5f5"/>
      <text x="368" y="164" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">PARSE · SPLIT INTO CONVERSATIONS</text>
      <!-- M3 (focal, two lines) -->
      <rect x="364" y="200" width="228" height="28" rx="2" fill="#f5f5f5"/>
      <text x="368" y="212" fill="#eb6c36" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">MASK IDS · GENERALISE AGE / PLACE / TIME</text>
      <text x="368" y="224" fill="#eb6c36" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">RAW TEXT NEVER LEAVES THE DEVICE</text>
      <!-- M4 -->
      <rect x="404" y="296" width="192" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="304" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MASKED TEXT ONLY · EXTRACT FACETS</text>
      <!-- M5 -->
      <rect x="436" y="328" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="336" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FACET ENVELOPE · JSON</text>
      <!-- M6 -->
      <rect x="140" y="380" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="220" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">REVIEW · 2 CONSENTS + EXPIRY</text>
      <!-- M7 -->
      <rect x="196" y="412" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="220" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APPROVE</text>
      <!-- M8 (right of self-loop) -->
      <rect x="364" y="460" width="280" height="12" rx="2" fill="#f5f5f5"/>
      <text x="368" y="468" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">PER LISTING · AES-GCM KEY · CTL KEY PAIR · ENCRYPT</text>
      <!-- M9 (kept between Browser and 0G TEE lifelines) -->
      <rect x="344" y="500" width="312" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="508" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CIPHERTEXT · COARSE TAGS · CTL PUBLIC KEY · WRAPPED KEY</text>
      <!-- M10 -->
      <rect x="952" y="532" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1040" y="540" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">executeBatch · createEntity ×N</text>
      <!-- M11 -->
      <rect x="980" y="564" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1040" y="572" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY KEYS · TX HASH</text>
      <!-- M12 (kept between 0G TEE and Server lifelines) -->
      <rect x="720" y="596" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="800" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LISTING IDS · EXPLORER LINK</text>

      <!-- =================================================================
           ACTOR BOXES — drawn after arrows. 160 × 56, top y=40.
           ================================================================= -->
      <!-- User (input) -->
      <rect x="40" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="40" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="48" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="64" y="56" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="120" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">User</text>
      <text x="120" y="88" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">data owner</text>

      <!-- Browser (backend / step) -->
      <rect x="240" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="248" y="48" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="268" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DEVICE</text>
      <text x="320" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Browser</text>
      <text x="320" y="88" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">on device</text>

      <!-- 0G TEE (external) -->
      <rect x="600" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="40" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="608" y="48" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="624" y="56" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TEE</text>
      <text x="680" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">0G TEE</text>
      <text x="680" y="88" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">private inference</text>

      <!-- Server (backend) -->
      <rect x="840" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="840" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="848" y="48" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="864" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="920" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Server</text>
      <text x="920" y="88" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">platform writer</text>

      <!-- Arkiv (store) -->
      <rect x="1080" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="1080" y="40" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="1088" y="48" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="1108" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CHAIN</text>
      <text x="1160" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Arkiv</text>
      <text x="1160" y="88" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">public entities</text>

      <!-- =================================================================
           LEGEND — horizontal strip at the bottom.
           ================================================================= -->
      <line x1="40" y1="652" x2="1240" y2="652" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="680" width="4" height="16" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="52" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Activation</text>

      <line x1="160" y1="688" x2="188" y2="688" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#upload-sequence-arrow)"/>
      <text x="196" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Local step</text>

      <line x1="300" y1="688" x2="328" y2="688" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#upload-sequence-arrow-link)"/>
      <text x="336" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Network call</text>

      <line x1="444" y1="688" x2="472" y2="688" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#upload-sequence-arrow)"/>
      <text x="480" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Return</text>

      <line x1="556" y1="688" x2="584" y2="688" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#upload-sequence-arrow-accent)"/>
      <text x="592" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Focal: masking on device</text>

      <rect x="772" y="680" width="32" height="16" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="788" y="692" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">OPT</text>
      <text x="812" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Optional fragment</text>
    </svg>
  </div>
</body>
</html>
